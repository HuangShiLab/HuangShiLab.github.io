name: Update from Google Scholar

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month at 00:00 UTC
  workflow_dispatch:      # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        working-directory: site
        run: npm ci

      - name: Install Python dependencies
        run: pip install requests

      - name: Run sync script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/fetch_scholar.py

      - name: Rebuild site
        working-directory: site
        run: npm run build

      - name: Sync built files to repo root
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # remove previous built files from root (keep site/, scripts/, .github/, README.md)
          git rm -r -q --cached assets 2>/dev/null || true
          git rm -q --cached index.html 404.html .nojekyll 2>/dev/null || true
          git rm -q --cached '*.jpg' '*.png' 2>/dev/null || true
          rm -rf assets index.html 404.html .nojekyll ./*.jpg ./*.png
          cp -r dist/. .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "auto: sync publications from Google Scholar ($(date +%Y-%m-%d))"
            git push
          }
